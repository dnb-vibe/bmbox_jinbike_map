<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f8f9">
<title>배민탑박스 취급 정비소 안내</title>
<style>
  :root{
    --bg:#f4f5f6; --card:#ffffff; --ink:#1f2328; --ink-sub:#5b6470; --ink-mute:#8b95a1;
    --line:#e7eaed; --line-strong:#d7dce1; --mint:#2ac1bc; --mint-soft:#e9f7f6;
    --primary:#2b2f36; --primary-ink:#ffffff; --danger:#e0574f; --ok:#2f9e6f;
    --radius:16px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(20,25,30,.04), 0 8px 24px rgba(20,25,30,.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; letter-spacing:-.01em; line-height:1.55;
  }
  .frame{max-width:440px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column;}
  .topbar{
    position:sticky; top:0; z-index:20; background:rgba(244,245,246,.82);
    backdrop-filter:saturate(180%) blur(12px); padding:14px 20px 12px;
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
  }
  .topbar .ttl{font-size:15px; font-weight:700; letter-spacing:-.02em;}
  .topbar .ttl small{display:block; font-size:11px; font-weight:500; color:var(--ink-mute); margin-top:1px;}
  main{flex:1; padding:22px 20px 40px;}
  h1.page{font-size:22px; font-weight:800; letter-spacing:-.03em; margin:0 0 8px;}
  .lead{font-size:14px; color:var(--ink-sub); margin:0 0 20px; line-height:1.6;}
  .lead .hl{color:#127c78; font-weight:700;}
  /* ===== 가까운 정비소 찾기 (sf-) ===== */
  .sf-locbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--mint-soft);color:#127c78;font-weight:800;font-size:14px;padding:13px;border:none;border-radius:12px;margin-bottom:14px;cursor:pointer;}
  .sf-locbtn.on{background:var(--mint);color:#fff;}
  .sf-locbtn .dot{width:9px;height:9px;border-radius:50%;background:currentColor;}
  .sf-locnote{font-size:12px;color:var(--ink-sub);margin:-6px 2px 14px;line-height:1.5;}
  .sf-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .sf-chip{padding:9px 0;text-align:center;border-radius:20px;border:1.5px solid #dfe3e8;background:#fff;font-size:13.5px;font-weight:700;color:#5a626c;cursor:pointer;white-space:nowrap;}
  .sf-chip.sel{border-color:var(--mint);background:var(--mint-soft);color:#127c78;font-weight:800;}
  .sf-search{position:relative;margin-bottom:16px;}
  .sf-search input{width:100%;height:46px;border:1.5px solid #dfe3e8;border-radius:12px;padding:0 38px;font-size:14px;color:var(--ink);background:#fff;}
  .sf-search input:focus{outline:none;border-color:var(--mint);}
  .sf-search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9aa2ac;font-size:15px;}
  .sf-search .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;background:#eceef1;border-radius:50%;color:#6b7480;font-size:12px;cursor:pointer;display:none;}
  .sf-cov{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:14px;overflow:hidden;}
  .sf-cov summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13.5px;font-weight:700;color:#3d454e;display:flex;align-items:center;gap:6px;}
  .sf-cov summary::-webkit-details-marker{display:none;}
  .sf-cov summary .arw{margin-left:auto;color:#9aa2ac;transition:.2s;font-size:12px;}
  .sf-cov[open] summary .arw{transform:rotate(180deg);}
  .sf-cov .body{padding:2px 14px 13px;font-size:12.5px;color:var(--ink-sub);line-height:1.75;}
  .sf-cov .body b{color:var(--ink);font-weight:800;}
  .sf-count{font-size:12.5px;color:var(--ink-sub);margin-bottom:10px;}
  .sf-count b{color:var(--ink);}
  .sf-shop{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 15px 13px;margin-bottom:11px;}
  .sf-r1{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .sf-nm{font-size:16px;font-weight:800;}
  .sf-km{margin-left:auto;background:var(--mint-soft);color:#127c78;font-weight:800;font-size:12px;padding:4px 9px;border-radius:20px;white-space:nowrap;}
  .sf-rank{width:22px;height:22px;border-radius:7px;background:#2b3038;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .sf-sign{display:inline-flex;align-items:center;gap:5px;background:#f2f4f6;color:#6b7480;border:1px solid #e6e9ed;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;margin-bottom:8px;}
  .sf-ad{font-size:12.5px;color:var(--ink-sub);line-height:1.45;margin-bottom:11px;}
  .sf-btns{display:flex;gap:8px;}
  .sf-btns a{flex:1;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer;}
  .sf-btn-call{background:var(--mint);color:#fff;}
  .sf-btn-map{background:#fff;color:#3d454e;border:1.5px solid #dfe3e8;}
  .sf-nlogo{background:#03c75a;color:#fff;font-weight:900;font-size:12px;width:19px;height:19px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:-.5px;}
  .sf-empty{text-align:center;color:var(--ink-sub);font-size:14px;padding:40px 0;line-height:1.6;}
  .closed-banner{display:none;background:#fff6f5;border:1px solid #f6d5d3;color:#c0392b;font-weight:800;font-size:14px;text-align:center;padding:13px;border-radius:12px;margin-bottom:14px;}
  .btn.is-closed{background:#e9ecef !important;color:#9aa2ac !important;cursor:default;}
</style>
</head>

</div>

  const REGION_ORDER = ['서울','경기','인천','경상','전라','충청'];
  let curRegion='전체', myPos=null, query='';
  const nrm = s => String(s||'').toLowerCase().replace(/\s+/g,'');
  function distKm(a,b){const R=6371,r=x=>x*Math.PI/180;const dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);const s=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
  const fmtKm = km => km<1 ? '약 '+Math.round(km*1000)+'m' : '약 '+km.toFixed(1)+'km';
  const telHref = t => 'tel:'+String(t).replace(/[^0-9]/g,'');
  const mapHref = s => s.mapUrl || ('https://map.naver.com/p/search/'+encodeURIComponent(s.name+' '+s.addr));
  function buildChips(){
    const present = REGION_ORDER.filter(rg=>SHOPS.some(s=>s.region===rg));
    const box=$('#sfChips'); box.innerHTML='';
    ['전체',...present].forEach(rg=>{const c=document.createElement('div');c.className='sf-chip'+(rg===curRegion?' sel':'');c.textContent=rg;c.onclick=()=>{curRegion=rg;render();};box.appendChild(c);});
  }
  function render(){
    buildChips();
    let list=SHOPS.filter(s=>curRegion==='전체'||s.region===curRegion);
    if(query){const q=nrm(query);list=list.filter(s=>nrm(s.name).includes(q)||nrm(s.addr).includes(q)||(s.sign&&!s.sign.includes('진바이크')&&nrm(s.sign).includes(q)));}
    if(myPos){list=list.map(s=>({...s,_km:distKm(myPos,s)})).sort((a,b)=>a._km-b._km);}
    $('#sfCount').innerHTML='총 <b>'+list.length+'곳</b>'+(myPos?' · 가까운 순':'');
    const wrap=$('#sfList');
    if(!list.length){wrap.innerHTML=query?'<div class="sf-empty">검색 결과가 없어요.<br>다른 검색어로 찾아 주세요.</div>':'<div class="sf-empty">해당 권역에 제휴 정비소가 없어요.<br>다른 지역을 선택해 주세요.</div>';return;}
    wrap.innerHTML=list.map((s,i)=>`
      <div class="sf-shop">
        <div class="sf-r1">${myPos?`<span class="sf-rank">${i+1}</span>`:''}<span class="sf-nm">${s.name}</span>${myPos?`<span class="sf-km">${fmtKm(s._km)}</span>`:`<span class="sf-km">${s.region}</span>`}</div>
        ${s.sign&&!s.sign.includes('진바이크')?`<div class="sf-sign">${s.sign}</div>`:''}
        <div class="sf-ad">${s.addr}</div>
        <div class="sf-btns"><a class="sf-btn-call" href="${telHref(s.tel)}">📞 전화하기</a><a class="sf-btn-map" href="${mapHref(s)}" target="_blank" rel="noopener"><span class="sf-nlogo">N</span> 지도</a></div>
      </div>`).join('');
  }
  $('#sfLocBtn').onclick=()=>{
    const btn=$('#sfLocBtn'),note=$('#sfLocNote');
    if(!navigator.geolocation){note.style.display='block';note.textContent='이 브라우저에서는 위치 기능을 쓸 수 없어요. 지역을 선택해 찾아 주세요.';return;}
    btn.textContent='위치 확인 중…';
    navigator.geolocation.getCurrentPosition(
      pos=>{myPos={lat:pos.coords.latitude,lng:pos.coords.longitude};btn.className='sf-locbtn on';btn.innerHTML='<span class="dot"></span> 내 위치 기준 정렬됨';note.style.display='none';render();},
      err=>{btn.className='sf-locbtn';btn.innerHTML='<span class="dot"></span> 내 위치 기준 가까운 순 보기';note.style.display='block';note.textContent='위치 권한이 꺼져 있어 가까운 순 정렬을 못 했어요. 지역을 선택해 찾아 주세요.';},
      {enableHighAccuracy:true,timeout:8000}
    );
  };
  function buildCoverage(){
    const METRO=['서울','부산','대구','인천','광주','대전','울산','세종'];const by={};
    SHOPS.forEach(s=>{(by[s.region]=by[s.region]||[]).push(s);});
    const parts=[];
    REGION_ORDER.forEach(rg=>{const arr=by[rg];if(!arr)return;if(rg==='서울'||rg==='인천'){parts.push(`<b>${rg}</b>`);return;}
      const cities=[...new Set(arr.map(s=>{const t=s.addr.split(/\s+/);return METRO.includes(t[0])?t[0]:(t[1]||'').replace(/(시|군)$/,'');}).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
      parts.push(`<b>${rg}</b>(${cities.join('·')})`);});
    $('#sfCovBody').innerHTML=parts.join('<br>');
  }
  const qInput=$('#sfQ'),qClr=$('#sfQClr');
  qInput.addEventListener('input',()=>{query=qInput.value.trim();qClr.style.display=query?'block':'none';render();});
  qClr.addEventListener('click',()=>{qInput.value='';query='';qClr.style.display='none';render();qInput.focus();});
  buildCoverage(); render();
})();
